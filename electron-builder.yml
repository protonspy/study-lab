appId: dev.protonspy.studylab
productName: Study Lab
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: resources/skills
    to: skills
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
