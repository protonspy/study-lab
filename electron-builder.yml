appId: dev.protonspy.studylab
productName: Study Lab
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  # onnxruntime-node (the local embedding model) ships binaries for every platform; keep this one's.
  - "!node_modules/onnxruntime-node/bin/napi-v*/linux/**"
  - "!node_modules/onnxruntime-node/bin/napi-v*/darwin/**"
  - "!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**"
asar: true
# Native code cannot load from inside the asar.
asarUnpack:
  - node_modules/onnxruntime-node/bin/**
extraResources:
  - from: resources/skills
    to: skills
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
